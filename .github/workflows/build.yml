name: Build Tournament APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: User
            page: index.html
            appid: com.khelo.tournament
            label: Tournament
          - name: Admin
            page: admin.html
            appid: com.khelo.tournament.admin
            label: Tournament Admin
    runs-on: ubuntu-latest
    env:
      PAGE: ${{ matrix.page }}
      APPID: ${{ matrix.appid }}
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML files
        run: |
          test -f www/index.html || { echo "ERROR: www/index.html নেই। www ফোল্ডারে index.html আপলোড করুন"; exit 1; }
          test -f www/admin.html || { echo "ERROR: www/admin.html নেই। www ফোল্ডারে admin.html আপলোড করুন"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/khelo/tournament app/src/main/assets
          cp www/index.html www/admin.html app/src/main/assets/
          cat > settings.gradle <<'EOF_A'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Tournament"
          include ':app'
          EOF_A
          cat > build.gradle <<'EOF_B'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_B
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'EOF_C'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.khelo.tournament'
              compileSdk 34
              defaultConfig { applicationId 'com.khelo.tournament'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          EOF_C
          cat > app/src/main/AndroidManifest.xml <<'EOF_D'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Tournament" android:allowBackup="false" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize" android:windowSoftInputMode="adjustResize">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_D
          cat > app/src/main/java/com/khelo/tournament/MainActivity.java <<'EOF_E'
          package com.khelo.tournament;
          import android.app.Activity;import android.content.Intent;import android.graphics.Bitmap;import android.net.Uri;import android.os.*;import android.view.*;import android.webkit.*;import android.widget.*;
          public class MainActivity extends Activity{
           static final String START="file:///android_asset/index.html";//START
           WebView w;int taps=0;long last=0;
           void ext(Uri u){try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(Exception e){}}
           protected void onCreate(Bundle b){super.onCreate(b);
            w=new WebView(this);w.setBackgroundColor(0xFF000000);
            WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setAllowFileAccess(true);
            s.setMediaPlaybackRequiresUserGesture(false);s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
            s.setJavaScriptCanOpenWindowsAutomatically(true);s.setSupportMultipleWindows(true);
            w.setWebViewClient(new WebViewClient(){public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){String sc=r.getUrl().getScheme();if("file".equals(sc)||"about".equals(sc))return false;ext(r.getUrl());return true;}});
            w.setWebChromeClient(new WebChromeClient(){public boolean onCreateWindow(WebView v,boolean d,boolean u,Message m){
             WebView t=new WebView(MainActivity.this);final boolean[] done={false};
             t.setWebViewClient(new WebViewClient(){public void onPageStarted(WebView x,String url,Bitmap bm){if(!done[0]&&url!=null&&!url.equals("about:blank")){done[0]=true;ext(Uri.parse(url));x.stopLoading();}}});
             ((WebView.WebViewTransport)m.obj).setWebView(t);m.sendToTarget();return true;}});
            FrameLayout f=new FrameLayout(this);f.addView(w,new FrameLayout.LayoutParams(-1,-1));
            View hot=new View(this);int d=(int)(60*getResources().getDisplayMetrics().density);
            hot.setOnClickListener(new View.OnClickListener(){public void onClick(View v){long n=System.currentTimeMillis();taps=(n-last<1500)?taps+1:1;last=n;if(taps>=7){taps=0;w.loadUrl("file:///android_asset/admin.html");}}});
            f.addView(hot,new FrameLayout.LayoutParams(d,d,Gravity.TOP|Gravity.LEFT));
            setContentView(f);
            w.loadUrl(START);}
           public void onBackPressed(){if(w.canGoBack())w.goBack();else if(w.getUrl()!=null&&!w.getUrl().equals(START))w.loadUrl(START);else super.onBackPressed();}
          }
          EOF_E
      - name: Apply name, start page and icon
        run: |
          sed -i "s|applicationId 'com.khelo.tournament'|applicationId '$APPID'|" app/build.gradle
          sed -i "s|android:label=\"Tournament\"|android:label=\"$LABEL\"|" app/src/main/AndroidManifest.xml
          sed -i "s|android_asset/index.html\";//START|android_asset/$PAGE\";//START|" app/src/main/java/com/khelo/tournament/MainActivity.java
          ICON=""
          if [ "$PAGE" = "admin.html" ] && [ -f www/admin-icon.png ]; then ICON=www/admin-icon.png; elif [ -f www/icon.png ]; then ICON=www/icon.png; fi
          if [ -n "$ICON" ]; then
            head -c 8 "$ICON" | grep -q PNG || { echo "ERROR: $ICON আসল PNG নয় (JPG নাম বদলালে হয় না)। PNG করে আবার দিন"; exit 1; }
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp "$ICON" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            sed -i 's|<application |<application android:icon="@mipmap/ic_launcher" |' app/src/main/AndroidManifest.xml
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Tournament-${{ matrix.name }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
